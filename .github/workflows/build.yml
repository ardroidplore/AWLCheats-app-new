name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur proyek
        run: |
          set -e
          mkdir -p app/src/main/java/com/awl/cheats app/src/main/assets
          for f in CheatEngine.java MainActivity.java; do
            if [ -f "$f" ]; then mv "$f" app/src/main/java/com/awl/cheats/; fi
          done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f cheat.txt ]; then mv cheat.txt app/src/main/assets/; fi
          rm -f build.gradle pengaturan.gradle settings.gradle gradle.properties app/build.gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AWLCheats"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.awl.cheats'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.awl.cheats'
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          find . -path ./.git -prune -o -type f -print | sort

      - name: Tambah ikon aplikasi
        run: |
          set -e
          if [ -f ic_launcher_fg.png ] && [ -f ic_launcher_bg.png ]; then
            mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable-nodpi
            mv ic_launcher_fg.png ic_launcher_bg.png app/src/main/res/drawable-nodpi/
            for n in ic_launcher ic_launcher_round; do
          cat > app/src/main/res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF
            done
            if ! grep -q 'android:icon' app/src/main/AndroidManifest.xml; then
              sed -i 's|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
            fi
            echo "Ikon dipasang."
          else
            echo "PERINGATAN: ic_launcher_fg.png / ic_launcher_bg.png tidak ada di repo, ikon dilewati."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AWLCheats-apk
          path: app/build/outputs/apk/debug/app-debug.apk
