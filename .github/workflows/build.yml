name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur proyek
        run: |
          set -e
          mkdir -p app/src/main/java/com/awl/cheats app/src/main/assets
          for f in CheatEngine.java MainActivity.java; do
            if [ -f "$f" ]; then mv "$f" app/src/main/java/com/awl/cheats/; fi
          done
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f cheat.txt ]; then mv cheat.txt app/src/main/assets/; fi
          rm -f build.gradle pengaturan.gradle settings.gradle gradle.properties app/build.gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AWLCheats"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.awl.cheats'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.awl.cheats'
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          find . -path ./.git -prune -o -type f -print | sort

      - name: Tambah ikon aplikasi
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values

          cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2E7D32</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,58 H68 A10,10 0 0 1 68,78 H40 A10,10 0 0 1 40,58 Z" />
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M68,61 A7,7 0 1 1 68,75 A7,7 0 1 1 68,61 Z" />
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M54.00,23.50 L57.06,31.79 L65.89,32.14 L58.95,37.61 L61.35,46.11 L54.00,41.20 L46.65,46.11 L49.05,37.61 L42.11,32.14 L50.94,31.79 Z" />
          </vector>
          EOF

          for n in ic_launcher ic_launcher_round; do
          cat > app/src/main/res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          done

          if ! grep -q 'android:icon' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
          fi
          grep -n 'application' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AWLCheats-apk
          path: app/build/outputs/apk/debug/app-debug.apk
